name: ZuriStay CI

on:
  push:
    branches:
      - main
      - feature/admin-property-approval-v2

permissions:
  contents: read

concurrency:
  group: zuristay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      MPESA_ENVIRONMENT: sandbox
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
